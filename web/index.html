<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#05060f">
  <title>Pulse Lanes</title>
  <link rel="stylesheet" href="./lobby.css">
  <link rel="stylesheet" href="./style.css">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="icons/icon.svg">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon-180.png">
</head>
<body>
  <canvas id="canvas" width="960" height="540" aria-label="Three-dimensional tunnel view. Steer the ship away from incoming asteroids."></canvas>

  <!-- HUD: status only (spec 14). No setting or selection control lives here. -->
  <div id="hud" aria-label="Flight status">
    <span id="hud-score" title="ticks / 7200">0 / 7200</span>
    <div id="hud-energy" role="meter" aria-label="Energy" aria-valuemin="0" aria-valuemax="10000" aria-valuenow="10000"><span class="bar"><i></i></span><b class="val">10000</b></div>
    <span id="hud-lane" title="lane">2 / 3</span>
    <span id="hud-loop" title="loop and tempo">1 / 3 · 90 BPM</span>
    <span id="hud-weapon" title="weapon and cooldown">laser · ready</span>
    <button id="hud-pause" type="button" aria-label="Pause">Pause</button>
  </div>

  <!-- Touch layout (spec 6.1): thumb circle bottom-right; hop arrows and red fire button bottom-left. -->
  <div id="touch">
    <div id="stick" role="application" aria-label="Thumb circle: steer inside the tunnel"><span class="ring"></span><span class="knob"></span></div>
    <div id="cluster">
      <button id="hop-left" type="button" aria-label="Hop to the left lane">&#9664;</button>
      <button id="fire" type="button" aria-label="Fire"></button>
      <button id="hop-right" type="button" aria-label="Hop to the right lane">&#9654;</button>
    </div>
  </div>

  <div id="pause-overlay" role="dialog" aria-modal="true" aria-label="Paused" hidden>
    <div class="panel">
      <h2>Paused</h2>
      <p>Your next tick will wait.</p>
      <div class="row"><button id="pause-resume" type="button" class="primary">Resume</button><button id="pause-exit" type="button">Exit</button></div>
    </div>
  </div>

  <!-- Lobby: modal, shown iff no run is in progress (spec 14). Every set-* control is a descendant. -->
  <dialog id="lobby" aria-labelledby="lobby-title">
    <div class="lockup">
      <svg class="emblem" viewBox="0 0 64 64" aria-hidden="true" focusable="false">
        <circle class="ring r1" cx="32" cy="32" r="29"></circle>
        <circle class="ring r2" cx="32" cy="32" r="19"></circle>
        <circle class="ring r3" cx="32" cy="32" r="10"></circle>
        <path class="lane" d="M32 32L9 55M32 32v29M32 32l23 23"></path>
        <path class="ship" d="M32 41l-7 10h14z"></path>
      </svg>
      <h1 id="lobby-title"><span class="t1">Pulse</span><span class="t2">Lanes</span></h1>
      <p class="eyebrow">Three lanes · one pulse</p>
    </div>

    <section class="launch" aria-label="Run">
      <button id="play" type="button" class="primary hero">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path class="solid" d="M7 4l13 8-13 8z"></path></svg>
        <span>Play</span>
      </button>
      <button id="retry" type="button" class="icon" title="Retry same seed" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 12a8 8 0 1 0 2.3-5.6"></path><path d="M4 4v5h5"></path></svg>
        <span>Retry</span>
      </button>
    </section>

    <div class="data" aria-label="Status">
      <div><span class="k">Seed</span><output id="seed"></output></div>
      <div><span class="k">GPU</span><output id="renderer-kind">unknown</output></div>
      <div class="wide"><span class="k">Last</span><output id="last-result">No run yet.</output></div>
      <div class="wide"><span class="k">Best</span><output id="history">No runs yet.</output></div>
    </div>

    <div class="keys" aria-label="Controls">
      <span><kbd>WASD</kbd>Steer</span>
      <span><kbd>&#8592; &#8594;</kbd>Hop</span>
      <span><kbd>Space</kbd>Fire</span>
      <span><kbd>Esc</kbd>Pause</span>
    </div>

    <section class="settings" aria-label="Settings">
      <div class="tile volume music">
        <label for="set-volume">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M4 9h4l5-4v14l-5-4H4z"></path><path d="M15 8a5 5 0 0 1 0 8"></path><path d="M17.5 5.5a9 9 0 0 1 0 13"></path></svg>
          <span>Volume</span><output id="set-volume-value">8</output>
        </label>
        <input id="set-volume" type="range" min="0" max="10" step="1" value="8">
      </div>
      <div class="tile">
        <label for="set-quality">
          <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M6 3h12l4 6-10 12L2 9z"></path><path d="M2 9h20M9 3l3 18 3-18"></path></svg>
          <span>Quality</span>
        </label>
        <select id="set-quality"><option value="high" selected>high</option><option value="low">low</option></select>
      </div>
      <label class="tile toggle" title="Reduced motion">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M2 12c3-4 5-4 8 0s5 4 8 0c1.5-2 3-2 4-2"></path></svg>
        <span>Calm</span><input id="set-reduced-motion" type="checkbox" aria-label="Reduced motion">
      </label>
    </section>

    <section class="vault" aria-label="Save data">
      <button id="save" type="button" class="icon" title="Save">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M5 3h11l4 4v14H5z"></path><path d="M8 3v5h8V3M8 14h8v7H8z"></path></svg>
        <span>Save</span>
      </button>
      <button id="load" type="button" class="icon" title="Load">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M3 6h6l2 2h10v11H3z"></path><path d="M3 11h18"></path></svg>
        <span>Load</span>
      </button>
      <button id="export" type="button" class="icon" title="Export save">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 15V3M7 8l5-5 5 5"></path><path d="M4 14v6h16v-6"></path></svg>
        <span>Export</span>
      </button>
      <label class="button icon" for="import" title="Import save">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 3v12M7 10l5 5 5-5"></path><path d="M4 14v6h16v-6"></path></svg>
        <span>Import</span><input id="import" type="file" accept="application/json,.json">
      </label>
      <button id="reset" type="button" class="icon" title="New empty save">
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 3l2.2 6.8L21 12l-6.8 2.2L12 21l-2.2-6.8L3 12l6.8-2.2z"></path></svg>
        <span>New</span>
      </button>
      <button id="replay" type="button" class="icon" title="Export replay" disabled>
        <svg viewBox="0 0 24 24" aria-hidden="true" focusable="false"><rect x="3" y="5" width="18" height="14" rx="2"></rect><path class="solid" d="M10 9l5 3-5 3z"></path></svg>
        <span>Replay</span>
      </button>
    </section>

    <output id="notice" role="status"></output>
  </dialog>

  <script type="module" src="./app.js"></script>
</body>
</html>
