<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <!-- Pulse Lanes maskable icon (FB3-ICON): full-bleed background, motif scaled into the inner 80 percent safe zone. -->
  <rect x="0" y="0" width="512" height="512" fill="#070b14"/>
  <g id="motif" transform="translate(51.2 51.2) scale(0.8)">
    <!-- star dots (7) -->
    <g fill="#eef7ff">
      <circle cx="36" cy="40" r="5"/>
      <circle cx="410" cy="30" r="4"/>
      <circle cx="470" cy="48" r="6"/>
      <circle cx="492" cy="150" r="4"/>
      <circle cx="28" cy="470" r="5"/>
      <circle cx="100" cy="495" r="4"/>
      <circle cx="215" cy="220" r="6"/>
    </g>
    <!-- lane tunnel: three concentric rings receding to a vanishing point 8 percent left of and above center -->
    <g fill="none" stroke="#4de8ff">
      <circle cx="215" cy="220" r="200" stroke-width="18"/>
      <circle cx="215" cy="220" r="112" stroke-width="14"/>
      <circle cx="215" cy="220" r="54" stroke-width="13"/>
    </g>
    <!-- amber branch tube arc entering from the right edge -->
    <path d="M 540 232 A 210 210 0 0 0 372 346" fill="none" stroke="#ff9a3c" stroke-width="24" stroke-linecap="round"/>
    <!-- faceted asteroid, 7 sides, mid-depth inside the largest ring -->
    <polygon points="344,99 365,112 374,136 355,152 331,156 317,135 321,111" fill="#c9a27a"/>
    <polygon points="346,131 374,136 355,152 331,156" fill="#a07a55"/>
    <polygon points="344,99 321,111 317,135 340,126" fill="#e3c39d"/>
    <!-- dart ship, plan view from web/ships.js (x right, z back, nose up), scaled 60 -->
    <g transform="translate(256 392) scale(60)">
      <polygon points="0,-1.7 0.22,-0.95 0.42,-0.2 1.25,0.62 1.2,0.8 0.5,0.62 0.3,0.85 -0.3,0.85 -0.5,0.62 -1.2,0.8 -1.25,0.62 -0.42,-0.2 -0.22,-0.95" fill="#4de8ff" stroke="#4de8ff" stroke-width="0.25" stroke-linejoin="round"/>
      <polygon points="0,-1.7 0.22,-0.95 0.42,-0.2 1.25,0.62 1.2,0.8 0.5,0.62 0.3,0.85 -0.3,0.85 -0.5,0.62 -1.2,0.8 -1.25,0.62 -0.42,-0.2 -0.22,-0.95" fill="#eef7ff"/>
      <ellipse cx="0" cy="-0.55" rx="0.2" ry="0.42" fill="#4de8ff"/>
    </g>
  </g>
</svg>
